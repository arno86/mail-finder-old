[project]
name = "mail-finder"
version = "0.1.0"
description = "Wait for a test email over IMAP and read the link on a button."
requires-python = ">=3.12"
dependencies = ["beautifulsoup4>=4.12"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: needs the GreenMail server from docker compose",
]
log_cli = true
log_cli_level = "INFO"
log_level = "INFO"
log_format = "%(asctime)s %(levelname)s %(message)s"
log_date_format = "%H:%M:%S"
